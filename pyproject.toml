[project]
name = "mye-physics-voice-studio"
version = "0.1.0"
description = "Script -> animated physics lesson narrated with AssemblyAI TTS, self-verified with AssemblyAI STT"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = ["websockets>=13", "requests>=2.31", "python-dotenv>=1.0"]

[project.optional-dependencies]
ui = ["gradio>=4"]

[project.scripts]
voicestudio = "voicestudio.cli:main"

[tool.setuptools]
packages = ["voicestudio", "voicestudio.gx"]
